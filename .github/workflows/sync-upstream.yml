name: Sync Upstream
'on':
  schedule:
  - cron: 19 * * * *
  workflow_dispatch:
    inputs:
      dry_run:
        description: Compare without pushing
        type: boolean
        default: false
      force:
        description: Force official gems refresh after safe sync
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: sync-upstream-${{ github.repository }}
  cancel-in-progress: false
jobs:
  sync:
    uses: Murmansk-Seer/.github/.github/workflows/sync-identical-reusable.yml@217c4bd9e52d59623602371523ab377cd81dbf17
    with:
      implementation_ref: 217c4bd9e52d59623602371523ab377cd81dbf17
      dry_run: ${{ inputs.dry_run == true }}
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CONFIG_PACKAGE_BASE_URL: https://newseer.61.com/Assets/StandaloneWindows64/ConfigPackage/
    steps:
    - name: Checkout fork
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: main
    - name: Record refresh revision
      run: echo "REFRESH_BASE=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
    - name: Check source changes
      id: check
      env:
        FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force == true }}
      run: |
        set -e
        git remote add upstream https://github.com/SeerAPI/config-sources.git || git remote set-url upstream https://github.com/SeerAPI/config-sources.git
        git fetch upstream main

        official_version="$(curl -fsSL --connect-timeout 15 --max-time 60 \
          --retry 2 --retry-all-errors --retry-delay 2 \
          "${CONFIG_PACKAGE_BASE_URL%/}/PackageManifest_ConfigPackage.version?t=$(date +%s)")"
        if ! [[ "$official_version" =~ ^[0-9]{14}$ ]]; then
          echo "::error::Invalid official ConfigPackage version"
          exit 1
        fi
        local_version="$(cat unity/.version 2>/dev/null || true)"

        if git merge-base --is-ancestor upstream/main HEAD; then
          upstream_changed=false
        else
          upstream_changed=true
        fi

        echo "official_version=${official_version}" >> "$GITHUB_OUTPUT"
        echo "local_version=${local_version}" >> "$GITHUB_OUTPUT"
        echo "upstream_changed=${upstream_changed}" >> "$GITHUB_OUTPUT"

        if [ "${FORCE}" != "true" ] && [[ "$local_version" =~ ^[0-9]{14}$ ]] && [ "${official_version}" -le "${local_version}" ] && [ "${upstream_changed}" = "false" ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "Official ConfigPackage and upstream config-sources are unchanged. Skipping sync."
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "Sync required: force=${FORCE}, official=${official_version}, local=${local_version}, upstream_changed=${upstream_changed}"
        fi
    - name: Skip unchanged sync
      if: steps.check.outputs.skip == 'true'
      run: echo "No official or upstream updates; workflow succeeded without rebuilding."
    - name: Set up Python
      if: steps.check.outputs.skip != 'true'
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Set up uv
      if: steps.check.outputs.skip != 'true'
      uses: astral-sh/setup-uv@v7
    - name: Install Unity parser
      if: steps.check.outputs.skip != 'true'
      run: |
        uv pip install --system --upgrade seerapi-solaris UnityPy
    - name: Refresh official Unity gems
      if: steps.check.outputs.skip != 'true'
      run: |
        python .github/scripts/refresh_unity_gems.py
    - name: Commit and push changes
      if: steps.check.outputs.skip != 'true'
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        set -e
        git add unity/.version unity/gems.json
        if ! git diff --cached --quiet; then
          timestamp=$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')
          git commit -m "Refresh official Unity gems $timestamp"
        fi
        for attempt in 1 2 3; do
          if git fetch origin main; then
            remote=$(git rev-parse FETCH_HEAD)
            if [ "$remote" = "$(git rev-parse HEAD)" ]; then exit 0; fi
            if ! git diff --quiet "$REFRESH_BASE" "$remote"; then
              echo "::error::Remote content changed during refresh; rerun from latest main."
              exit 1
            fi
            git merge --no-edit "$remote"
            if git push origin HEAD:main; then
              exit 0
            fi
          fi
          echo "::warning::Refresh push attempt ${attempt}/3 failed."
          if [ "$attempt" -lt 3 ]; then sleep $((attempt * 2)); fi
        done
        exit 1
    - name: Check downstream dispatch token
      if: steps.check.outputs.skip != 'true'
      env:
        CROSS_REPO_TOKEN: ${{ secrets.PAT }}
      run: |
        if [ -z "${CROSS_REPO_TOKEN}" ]; then
          echo "::error::Missing PAT secret; cannot dispatch the api-data build."
          exit 1
        fi
    - name: Dispatch api-data build
      if: steps.check.outputs.skip != 'true'
      uses: peter-evans/repository-dispatch@v4
      with:
        token: ${{ secrets.PAT }}
        repository: Murmansk-Seer/api-data
        event-type: config-source-update
    needs: sync
    if: ${{ !inputs.dry_run && (needs.sync.outputs.status == 'current' || needs.sync.outputs.status == 'merged') }}
